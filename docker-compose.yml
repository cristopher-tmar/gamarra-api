services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gamarra_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: gamarra_admin
      POSTGRES_PASSWORD: gamarra_local_2026
      POSTGRES_DB: gamarra_db

    ports:
      - "5432:5432"

    volumes:
      - gamarra_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U gamarra_admin -d gamarra_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gamarra_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gamarra.com
      PGADMIN_DEFAULT_PASSWORD: gamarra_admin_2026

    ports:
      - "5050:80"

    volumes:
      - gamarra_pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gamarra_postgres_data:
    name: gamarra_postgres_data

  gamarra_pgadmin_data:
    name: gamarra_pgadmin_data

